#cloud-config
# Dijalankan sekali saat VM pertama kali boot (Ubuntu 24.04). ${SSH_PUBKEY} diisi oleh provision.sh.
package_update: true
package_upgrade: true
apt:
  sources:
    docker.list:   # repo resmi Docker -> compose plugin terbaru (butuh >= 2.24.4 untuk !override)
      source: deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
packages: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin, ufw, fail2ban, unattended-upgrades, jq, rsync]
users:
  - name: gambut
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys: ["${SSH_PUBKEY}"]
ssh_pwauth: false
disable_root: true
swap: {filename: /swapfile, size: 2G}
runcmd:
  - ufw default deny incoming && ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/; s/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && systemctl restart ssh
  - systemctl enable --now docker fail2ban unattended-upgrades
  - mkdir -p /srv/gambut /srv/backup && chown -R gambut:gambut /srv/gambut /srv/backup
